<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin MIGR</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head>
<body class="bg-[#eef2f7]">

</div>
</header>
<main class="max-w-7xl mx-auto p-6">

<div class="bg-[#22c55e] text-white px-6 py-3 rounded-xl font-black">TODOS • 2 por hoja</div>
</div>

</main>

</html>
