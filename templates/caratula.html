<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIGR Ocosingo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{min-height:100vh;background:linear-gradient(135deg,#e0e7ff,#f8fafc);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;width:100%;max-width:420px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.12);text-align:center;overflow:hidden}
.top{padding:40px 30px 20px}
.logo{width:90px;height:90px;background:#f1f5f9;border-radius:18px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center}
h1{color:#1e293b;font-size:22px}
h1 span{color:#4f46e5}
.sub{color:#64748b;font-size:14px;margin-top:8px;font-weight:bold;letter-spacing:1px}
.btns{padding:0 30px 30px;display:flex;flex-direction:column;gap:12px}
.btn{padding:15px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:15px}
.btn1{background:#4f46e5;color:white}
.btn2{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}
</style>
</head>
<body>
<div class="card">
<div class="top">
<div class="logo"><img src="/static/logo.png" style="width:100%" onerror="this.parentElement.innerHTML='GAR'"></div>
<h1>Reporte de<br><span>Vida Espiritual</span></h1>
<p class="sub">MIGR Ocosingo</p>
</div>
<div class="btns">
<a href="/formulario" class="btn btn1">📝 Iniciar mi Reporte</a>
<a href="/admin" class="btn btn2">🔐 Ingreso Administrador</a>
</div>
</div>
</body>
</html>
